<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Assistant de commande</title>
<style>
  :root { --accent: #E05638; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #root { position: relative; height: 100%; }

  #launcher { position: absolute; bottom: 0; right: 0; width: 56px; height: 56px;
    border-radius: 9999px; border: 0; cursor: pointer; background: var(--accent); color: #fff;
    display: grid; place-items: center; box-shadow: 0 8px 24px rgba(15,23,42,.35); }
  #launcher:hover { filter: brightness(1.05); }
  #launcher svg { width: 24px; height: 24px; }

  #panel { position: absolute; bottom: 0; right: 0; width: 100%; height: 100%;
    display: none; flex-direction: column; overflow: hidden; border-radius: 16px;
    background: #fff; box-shadow: 0 16px 48px rgba(15,23,42,.28); border: 1px solid #e2e8f0; }
  #panel.open { display: flex; }

  #header { display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    background: #0F172A; color: #fff; flex: 0 0 auto; }
  #header .avatar { width: 34px; height: 34px; border-radius: 9999px; background: var(--accent);
    display: grid; place-items: center; flex: 0 0 auto; }
  #header .avatar svg { width: 18px; height: 18px; }
  #header .meta { min-width: 0; flex: 1; }
  #header .meta p { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #header .meta span { font-size: 11px; opacity: .7; }
  #close { border: 0; background: transparent; color: #fff; cursor: pointer; padding: 4px; line-height: 0; }
  #close svg { width: 18px; height: 18px; }

  #messages { flex: 1 1 auto; overflow-y: auto; padding: 12px; display: flex;
    flex-direction: column; gap: 10px; background: #f8fafc; }
  .bubble { max-width: 85%; padding: 8px 12px; border-radius: 16px; font-size: 13px;
    line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
  .user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .assistant { align-self: flex-start; background: #e2e8f0; color: #0F172A; border-bottom-left-radius: 4px; }
  .welcome { align-self: stretch; background: #f1f5f9; color: #334155; font-size: 13px;
    padding: 8px 12px; border-radius: 12px; }

  .cart { align-self: stretch; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px;
    padding: 10px 12px; font-size: 12px; color: #0F172A; }
  .cart .cart-title { display: flex; align-items: center; gap: 6px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .04em; font-size: 10px; color: #64748b; }
  .cart .line { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; }
  .cart .opts { display: block; font-size: 10px; color: #94a3b8; }
  .cart .foot { margin-top: 8px; padding-top: 8px; border-top: 1px solid #e2e8f0; }
  .cart .row { display: flex; justify-content: space-between; color: #64748b; margin-top: 2px; }
  .cart .total { display: flex; justify-content: space-between; font-weight: 700;
    color: #0F172A; margin-top: 4px; font-size: 13px; }

  #loading { display: none; align-items: center; gap: 8px; padding: 0 12px 8px;
    font-size: 12px; color: #64748b; background: #f8fafc; }
  #loading.show { display: flex; }
  .spinner { width: 14px; height: 14px; border: 2px solid #cbd5e1; border-top-color: var(--accent);
    border-radius: 9999px; animation: spin .8s linear infinite; flex: 0 0 auto; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #error { display: none; align-items: center; justify-content: space-between; gap: 8px;
    margin: 0 12px 8px; padding: 8px 10px; border-radius: 10px; font-size: 12px;
    background: #fee2e2; color: #b91c1c; }
  #error.show { display: flex; }
  #retry, #new-conv { border: 1px solid #fecaca; background: #fff; color: #b91c1c; border-radius: 8px;
    font-size: 11px; padding: 4px 8px; cursor: pointer; white-space: nowrap; }
  #retry:disabled, #new-conv:disabled { opacity: .5; cursor: default; }

  #form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #e2e8f0; background: #fff; flex: 0 0 auto; }
  #input { flex: 1; border: 1px solid #e2e8f0; border-radius: 10px; padding: 9px 12px;
    font-size: 13px; outline: none; }
  #input:focus { border-color: var(--accent); }
  #send { border: 0; border-radius: 10px; background: var(--accent); color: #fff; width: 40px;
    cursor: pointer; display: grid; place-items: center; }
  #send:disabled { opacity: .5; cursor: default; }
  #send svg { width: 16px; height: 16px; }

  /* D1.54: cartes produits de la conversation */
  .products { align-self: stretch; display: flex; flex-direction: column; gap: 8px; }
  .product { display: flex; align-items: stretch; background: #fff; border: 1px solid #e2e8f0;
    border-radius: 12px; overflow: hidden; }
  .product .p-img { width: 64px; min-height: 64px; flex: 0 0 auto; object-fit: cover; align-self: stretch; }
  .product .p-body { display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    min-width: 0; flex: 1 1 auto; }
  .product .p-info { min-width: 0; flex: 1 1 auto; }
  .p-name { font-size: 13px; font-weight: 600; color: #0F172A;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p-desc { font-size: 11px; color: #64748b; margin-top: 2px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .p-price { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
    font-weight: 700; color: #0F172A; margin-top: 3px; }
  .p-add { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 8px; border: 1px solid #e2e8f0;
    background: #fff; color: var(--accent); cursor: pointer; font-size: 18px; line-height: 1;
    display: grid; place-items: center; }
  .p-add:hover { border-color: var(--accent); }
  .p-none { flex: 0 0 auto; font-size: 11px; font-weight: 600; color: #dc2626; }

  /* D1.54: mini-sélecteur visuel des options */
  #opt-overlay { position: absolute; inset: 0; z-index: 20; display: none;
    align-items: flex-end; justify-content: center; padding: 12px;
    background: rgba(15, 23, 42, .45); }
  #opt-overlay.show { display: flex; }
  #opt-sheet { width: 100%; max-width: 340px; max-height: 92%; overflow-y: auto;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 14px;
    box-shadow: 0 16px 48px rgba(15,23,42,.3); padding: 14px; }
  .opt-title { font-size: 14px; font-weight: 700; color: #0F172A; }
  .opt-desc { font-size: 11px; color: #64748b; margin-top: 2px; }
  .opt-group { margin-top: 12px; }
  .opt-ghead { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px; }
  .opt-gname { font-size: 12px; font-weight: 600; color: #0F172A; }
  .opt-req { font-size: 11px; font-weight: 600; color: var(--accent); }
  .opt-lim { font-size: 11px; color: #94a3b8; }
  .opt-choices { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .opt-choice { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 7px 10px; border: 1px solid #e2e8f0; border-radius: 8px;
    font-size: 12px; color: #0F172A; cursor: pointer; }
  .opt-choice.on { border-color: var(--accent); background: rgba(224, 86, 56, .06); }
  .opt-choice.off { opacity: .4; cursor: default; pointer-events: none; }
  .opt-choice input { accent-color: var(--accent); flex: 0 0 auto; }
  .opt-choice .opt-name { flex: 1 1 auto; min-width: 0; }
  .opt-choice .opt-delta { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; color: #64748b; }
  .opt-empty { font-size: 11px; color: #b91c1c; margin-top: 4px; }
  .opt-gmsg { font-size: 11px; color: #b91c1c; margin-top: 4px; display: none; }
  .opt-gmsg.show { display: block; }
  .opt-qty { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 14px; }
  .opt-qty button { width: 32px; height: 32px; border: 1px solid #e2e8f0; background: #fff;
    border-radius: 8px; cursor: pointer; font-size: 16px; line-height: 1; color: #0F172A; }
  .opt-qty span { font-size: 15px; font-weight: 700; min-width: 28px; text-align: center;
    color: #0F172A; }
  #opt-err { margin-top: 10px; font-size: 11px; color: #b91c1c; background: #fee2e2;
    border-radius: 8px; padding: 7px 9px; display: none; }
  #opt-err.show { display: block; }
  .opt-foot { display: flex; gap: 8px; margin-top: 14px; }
  .opt-cancel { flex: 0 0 auto; border: 1px solid #e2e8f0; background: #fff; color: #0F172A;
    border-radius: 10px; padding: 9px 12px; font-size: 12px; cursor: pointer; }
  .opt-confirm { flex: 1 1 auto; border: 0; border-radius: 10px; background: var(--accent);
    color: #fff; padding: 9px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .opt-confirm:disabled { opacity: .5; cursor: default; }

  /* D1.54: confirmation d'ajout */
  #toast { position: absolute; left: 12px; right: 12px; bottom: 66px; z-index: 30;
    display: none; padding: 9px 12px; border-radius: 10px; font-size: 12px; text-align: center;
    background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0;
    box-shadow: 0 8px 24px rgba(15,23,42,.18); }
  #toast.show { display: block; }
  #toast.err { background: #fee2e2; color: #b91c1c; border-color: #fecaca; }

  .p-add:focus-visible, .opt-cancel:focus-visible, .opt-confirm:focus-visible,
  .opt-qty button:focus-visible, .opt-choice:focus-within {
    outline: 2px solid var(--accent); outline-offset: 1px; }

  @media (max-width: 480px) {
    #panel { border-radius: 12px; }
  }
</style>
</head>
<body>
<div id="root">
  <button id="launcher" aria-label="Ouvrir l'assistant de commande" aria-expanded="false" data-testid="chat-launcher">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  </button>

  <div id="panel" role="dialog" aria-label="Assistant de commande" data-testid="chat-panel">
    <div id="header">
      <span class="avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
      <div class="meta">
        <p id="shop-name" data-testid="chat-shop-name">Assistant</p>
        <span>Répond instantanément</span>
      </div>
      <button id="close" aria-label="Fermer l'assistant" data-testid="chat-close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div id="messages" aria-live="polite" aria-label="Messages de la conversation" data-testid="chat-messages"></div>
    <div id="loading" data-testid="chat-loading"><span class="spinner"></span> L'assistant est en train d'écrire…</div>
    <div id="error" data-testid="chat-error"><span id="error-text"></span>
      <span style="display:flex;gap:6px;">
        <button id="new-conv" data-testid="chat-new-conversation" hidden>Nouvelle conversation</button>
        <button id="retry" data-testid="chat-retry">Réessayer</button>
      </span>
    </div>

    <form id="form">
      <input id="input" placeholder="Votre message…" aria-label="Votre message" maxlength="1000" autocomplete="off" data-testid="chat-input" />
      <button id="send" type="submit" aria-label="Envoyer le message" disabled data-testid="chat-send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </form>
  </div>

  <!-- D1.54: mini-sélecteur visuel des options (aucune dépendance externe) -->
  <div id="opt-overlay">
    <div id="opt-sheet" role="dialog" aria-modal="true" aria-labelledby="opt-title" data-testid="item-option-modal">
      <p id="opt-title" class="opt-title"></p>
      <p id="opt-desc" class="opt-desc"></p>
      <div id="opt-groups"></div>
      <div class="opt-qty">
        <button type="button" id="opt-minus" aria-label="Diminuer la quantité" data-testid="opt-minus">&minus;</button>
        <span id="opt-qty-value" data-testid="item-qty" aria-live="polite">1</span>
        <button type="button" id="opt-plus" aria-label="Augmenter la quantité" data-testid="opt-plus">+</button>
      </div>
      <p id="opt-err" role="alert" data-testid="chat-add-error"></p>
      <div class="opt-foot">
        <button type="button" id="opt-cancel" class="opt-cancel" data-testid="opt-cancel">Annuler</button>
        <button type="button" id="opt-confirm" class="opt-confirm" data-testid="confirm-add-item">Ajouter</button>
      </div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite" data-testid="chat-add-toast"></div>
</div>

<script>
(function () {
  "use strict";
  var params = new URLSearchParams(window.location.search);
  var restaurantId = params.get("restaurant") || "";
  var PARENT_ORIGIN = document.referrer ? new URL(document.referrer).origin : "*";
  // Le frame est servi par l'API : les fetch sont same-origin, aucun CORS requis.
  var API = "";

  var CLOSED_W = 64, CLOSED_H = 64, OPEN_W = 380, OPEN_H = 560;
  var open = false, sending = false, conversationId = null;
  // D1.53: panier partagé — le frame restore/persiste les ids serveur (contrat
  // D1.50) dans le localStorage de son origine API, isolé par restaurant.
  var cartId = null;
  var STORAGE_CONV = "menumind:conv:" + restaurantId;
  var STORAGE_CART = "menumind:cart:" + restaurantId;
  var messages = [], welcome = "", shopName = "Assistant";
  var lastFailedText = null, lastFailedStatus = null;
  // D1.54: mini-sélecteur d'options ouvert (null = fermé), verrou synchrone
  // d'ajout (anti double-clic — même rôle que `sending` côté chat), dernier
  // bouton "+" cliqué (retour du focus après fermeture) et minuteur du toast.
  var selector = null, adding = false, lastAddBtn = null, toastTimer = null;

  var el = {
    launcher: document.getElementById("launcher"),
    panel: document.getElementById("panel"),
    close: document.getElementById("close"),
    messages: document.getElementById("messages"),
    loading: document.getElementById("loading"),
    error: document.getElementById("error"),
    errorText: document.getElementById("error-text"),
    retry: document.getElementById("retry"),
    form: document.getElementById("form"),
    input: document.getElementById("input"),
    send: document.getElementById("send"),
    shopName: document.getElementById("shop-name"),
    optOverlay: document.getElementById("opt-overlay"),
    optSheet: document.getElementById("opt-sheet"),
    optTitle: document.getElementById("opt-title"),
    optDesc: document.getElementById("opt-desc"),
    optGroups: document.getElementById("opt-groups"),
    optQty: document.getElementById("opt-qty-value"),
    optErr: document.getElementById("opt-err"),
    optConfirm: document.getElementById("opt-confirm"),
    optMinus: document.getElementById("opt-minus"),
    optPlus: document.getElementById("opt-plus"),
    optCancel: document.getElementById("opt-cancel"),
    toast: document.getElementById("toast"),
  };

  function fmt(n) {
    return Number(n || 0).toLocaleString("fr-FR").replace(/ /g, " ") + " FCFA";
  }
  var ORDER_LABELS = { DELIVERY: "Livraison", PICKUP: "À emporter" };

  function notifySize() {
    var sw = (window.screen && window.screen.width) || 1280;
    var sh = (window.screen && window.screen.height) || 800;
    var w = open ? Math.min(OPEN_W, sw - 24) : CLOSED_W;
    var h = open ? Math.min(OPEN_H, sh - 120) : CLOSED_H;
    try {
      window.parent.postMessage({ type: "restoia-widget-size", width: w, height: h }, PARENT_ORIGIN);
    } catch (e) { /* origine hôte injoignable — tailles par défaut */ }
  }

  function render() {
    el.messages.innerHTML = "";
    if (messages.length === 0 && welcome) {
      var w = document.createElement("div");
      w.className = "welcome";
      w.setAttribute("data-testid", "chat-welcome");
      w.textContent = welcome;
      el.messages.appendChild(w);
    }
    messages.forEach(function (m) {
      if (m.role === "user") {
        var u = document.createElement("div");
        u.className = "bubble user";
        u.setAttribute("data-testid", "chat-message-user");
        u.textContent = m.content;
        el.messages.appendChild(u);
        return;
      }
      var wrap = document.createElement("div");
      wrap.setAttribute("data-testid", "chat-message-assistant");
      var a = document.createElement("div");
      a.className = "bubble assistant";
      a.textContent = m.content;
      wrap.appendChild(a);
      // D1.54: cartes produits livrées par le backend (menu du jour,
      // recommandation, catalogue paginé) — rendues telles quelles,
      // jamais fabriquées côté client; absent/vide = aucun bloc.
      if (m.products && m.products.length > 0) {
        var pw = document.createElement("div");
        pw.className = "products";
        pw.setAttribute("data-testid", "chat-products");
        m.products.forEach(function (p) { pw.appendChild(buildProductCard(p)); });
        wrap.appendChild(pw);
      }
      var cart = m.cart;
      if (cart && cart.items && cart.items.length > 0) {
        var card = document.createElement("div");
        card.className = "cart";
        card.setAttribute("data-testid", "chat-cart-card");
        var title = document.createElement("p");
        title.className = "cart-title";
        title.textContent = " Panier";
        card.appendChild(title);
        cart.items.forEach(function (line) {
          var l = document.createElement("div");
          l.className = "line";
          var left = document.createElement("span");
          left.textContent = line.quantity + " × " + line.name;
          if (line.options && line.options.length) {
            var o = document.createElement("span");
            o.className = "opts";
            o.textContent = line.options.map(function (x) { return x.name; }).join(", ");
            left.appendChild(o);
          }
          var right = document.createElement("span");
          right.textContent = fmt(line.line_total);
          l.appendChild(left); l.appendChild(right);
          card.appendChild(l);
        });
        var foot = document.createElement("div");
        foot.className = "foot";
        if (Number(cart.delivery_fee) > 0) {
          var fee = document.createElement("div");
          fee.className = "row";
          fee.innerHTML = "<span>Livraison</span><span>" + fmt(cart.delivery_fee) + "</span>";
          foot.appendChild(fee);
        }
        if (cart.order_type && ORDER_LABELS[cart.order_type]) {
          var mode = document.createElement("div");
          mode.className = "row";
          mode.innerHTML = "<span>Mode</span><span>" + ORDER_LABELS[cart.order_type] + "</span>";
          foot.appendChild(mode);
        }
        var total = document.createElement("div");
        total.className = "total";
        total.setAttribute("data-testid", "chat-cart-total");
        total.innerHTML = "<span>Total</span><span>" + fmt(cart.total) + "</span>";
        foot.appendChild(total);
        card.appendChild(foot);
        wrap.appendChild(card);
      }
      el.messages.appendChild(wrap);
    });
    el.messages.scrollTop = el.messages.scrollHeight;
  }

  function showError(text, retryText, status) {
    lastFailedText = retryText;
    lastFailedStatus = status || null;
    el.errorText.textContent = text;
    // 409 = panier non utilisable / conversation incompatible : proposer une
    // session neuve plutôt que de répéter la même requête condamnée.
    document.getElementById("new-conv").hidden = lastFailedStatus !== 409;
    el.error.classList.add("show");
  }
  function clearError() {
    el.error.classList.remove("show");
    lastFailedText = null;
    lastFailedStatus = null;
    document.getElementById("new-conv").hidden = true;
  }

  function storageGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function storageSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* stockage indisponible */ } }
  function storageDel(k) { try { localStorage.removeItem(k); } catch (e) { /* stockage indisponible */ } }

  // Purge des identifiants locaux seulement (les carts serveur sont jetables) —
  // utilisée sur 409 (choix utilisateur) et après une commande confirmée.
  function purgeSession() {
    storageDel(STORAGE_CONV);
    storageDel(STORAGE_CART);
    conversationId = null;
    cartId = null;
  }

  // Restauration au chargement : même règles que le store React (D1.51) —
  // GET cart, restauration si "open", purge si 4xx ou statut non-open,
  // conservation des ids en cas d'erreur réseau (retry au prochain tour).
  function restoreSession() {
    var conv = storageGet(STORAGE_CONV);
    if (conv) conversationId = conv;
    var cart = storageGet(STORAGE_CART);
    if (!cart) return Promise.resolve();
    return fetch(API + "/api/public/cart/" + encodeURIComponent(cart))
      .then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (data) {
          if (res.status === 200 && data.status === "open") {
            cartId = data.cart_id || cart;
            storageSet(STORAGE_CART, cartId);
          } else if (res.status >= 400 && res.status < 500) {
            purgeSession();
          }
          // 5xx serveur : on conserve les identifiants (transitoire).
        });
      })
      .catch(function () { /* erreur réseau : on conserve les identifiants */ });
  }
  var restoreDone = restoreSession();

  function setOpen(next) {
    open = next;
    el.panel.classList.toggle("open", open);
    el.launcher.setAttribute("aria-expanded", open ? "true" : "false");
    el.launcher.style.display = open ? "none" : "grid";
    notifySize();
    if (open) el.input.focus();
  }

  function apiErrorDetail(detail) {
    if (detail == null) return "Erreur de connexion. Vérifiez votre réseau.";
    if (typeof detail === "string") return detail;
    if (Array.isArray(detail)) return detail.map(function (e) { return e && e.msg ? e.msg : JSON.stringify(e); }).join(" ");
    if (detail && detail.msg) return detail.msg;
    return String(detail);
  }

  /* ---------- D1.54: cartes produits + mini-sélecteur d'options ---------- */

  function showToast(text, isError) {
    el.toast.textContent = text;
    el.toast.classList.toggle("err", !!isError);
    el.toast.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.toast.classList.remove("show"); }, 3200);
  }

  function showOptErr(text) {
    el.optErr.textContent = text;
    el.optErr.classList.add("show");
  }
  function clearOptErr() {
    el.optErr.textContent = "";
    el.optErr.classList.remove("show");
  }

  // Après un ajout réussi: la vue retournée ne porte ni order_type ni les
  // frais du draft (calculate_cart delivery_fee=0) — merge sélectif pour ne
  // pas régresser l'aperçu Panier affiché. La carte Panier du DERNIER message
  // assistant est mise à jour (même réconciliation que le store React).
  function applyCartUpdate(data) {
    for (var i = messages.length - 1; i >= 0; i--) {
      if (messages[i].role !== "assistant") continue;
      var prev = messages[i].cart || {};
      var merged = Object.assign({}, prev, data);
      if (Number(prev.delivery_fee) > 0 && Number(data.delivery_fee || 0) === 0) {
        merged.delivery_fee = prev.delivery_fee;
        merged.total = Number(data.total || 0) + Number(prev.delivery_fee);
      }
      messages[i].cart = merged;
      return;
    }
  }

  // Route existante cart_router POST /public/cart — en pratique cartId existe
  // déjà (les cartes arrivent dans une réponse portant cart_id); filet de
  // sécurité pour une restauration de session ayant échoué.
  function ensureCart() {
    if (cartId) return Promise.resolve(cartId);
    return fetch(API + "/api/public/cart", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ restaurant_public_id: restaurantId }),
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (res.status >= 200 && res.status < 300 && data.cart_id) {
          cartId = data.cart_id;
          storageSet(STORAGE_CART, cartId);
          return cartId;
        }
        throw new Error(apiErrorDetail(data && data.detail));
      });
    });
  }

  // POST /public/cart/{cart_id}/items — seuls les IDS d'options partent vers
  // le serveur (jamais le prix affiché, qui n'est qu'un récapitulatif).
  function startAdd(product, optionIds, qty) {
    if (adding) return;
    adding = true;
    clearOptErr();
    if (selector) updateSelectorState(); // confirm -> "Ajout…" désactivé
    ensureCart().then(function (cid) {
      return fetch(API + "/api/public/cart/" + encodeURIComponent(cid) + "/items", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ item_id: product.id, quantity: qty, option_ids: optionIds || [] }),
      });
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        return { status: res.status, data: data };
      });
    }).then(function (r) {
      if (r.status >= 200 && r.status < 300) {
        if (r.data && r.data.cart_id) {
          cartId = r.data.cart_id;
          storageSet(STORAGE_CART, cartId);
        }
        if (r.data) applyCartUpdate(r.data);
        closeSelector(false);
        render();
        el.input.focus();
        showToast("« " + (product.name || "Article") + " » ajouté au panier", false);
        return;
      }
      var detail = apiErrorDetail(r.data && r.data.detail);
      if (r.status === 404 || r.status === 409) {
        // Panier introuvable ou déjà commandé: invalidation de session
        // existante (même cycle de vie que le chat sur 409), pas de faux succès.
        purgeSession();
        closeSelector(false);
        render();
        showToast(detail + " Envoyez un message pour démarrer un nouveau panier.", true);
        return;
      }
      // 400 (article/options invalides) ou autre: le sélecteur reste ouvert
      // avec la sélection conservée pour une nouvelle tentative sûre. Sans
      // sélecteur (ajout direct), le détail part dans le toast: jamais muet.
      if (selector) showOptErr(detail);
      else showToast(detail, true);
    }).catch(function () {
      if (selector) showOptErr("Erreur de connexion. Vérifiez votre réseau.");
      else showToast("Erreur de connexion. Vérifiez votre réseau.", true);
    }).then(function () {
      adding = false;
      if (selector) updateSelectorState();
    });
  }

  // Une carte produit = données serveur uniquement: tout le texte passe par
  // textContent, l'image par setAttribute — aucun HTML interprété.
  function buildProductCard(p) {
    var card = document.createElement("div");
    card.className = "product";
    card.setAttribute("data-testid", "chat-product");
    if (p.image_url) {
      var img = document.createElement("img");
      img.className = "p-img";
      img.setAttribute("src", p.image_url);
      img.alt = "";
      img.setAttribute("loading", "lazy");
      card.appendChild(img);
    }
    var body = document.createElement("div");
    body.className = "p-body";
    var info = document.createElement("div");
    info.className = "p-info";
    var name = document.createElement("p");
    name.className = "p-name";
    name.textContent = p.name || "";
    info.appendChild(name);
    if (p.description) {
      var desc = document.createElement("p");
      desc.className = "p-desc";
      desc.textContent = p.description;
      info.appendChild(desc);
    }
    var price = document.createElement("p");
    price.className = "p-price";
    price.textContent = fmt(p.price);
    info.appendChild(price);
    body.appendChild(info);
    if (p.available) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "p-add";
      btn.textContent = "+";
      btn.setAttribute("aria-label", "Ajouter " + (p.name || ""));
      btn.setAttribute("data-testid", "chat-product-add-" + p.id);
      btn.addEventListener("click", function () { onAddClick(p); });
      lastAddBtn = btn;
      body.appendChild(btn);
    } else {
      var none = document.createElement("span");
      none.className = "p-none";
      none.textContent = "Indisponible";
      none.setAttribute("data-testid", "chat-product-unavailable-" + p.id);
      body.appendChild(none);
    }
    card.appendChild(body);
    return card;
  }

  // Ajout direct sans options (contrat API: option_ids[]) sinon sélecteur.
  function onAddClick(p) {
    if (adding) return;
    if (!p.options || !p.options.length) {
      startAdd(p, [], 1);
      return;
    }
    openSelector(p);
  }

  function openSelector(p) {
    selector = { product: p, sel: {}, qty: 1 };
    (p.options || []).forEach(function (g) { selector.sel[g.id] = []; });
    renderSelector();
    clearOptErr();
    el.optOverlay.classList.add("show");
    var first = el.optSheet.querySelector("input:not([disabled]), button:not([disabled])");
    if (first) first.focus();
  }

  function closeSelector(restoreFocus) {
    el.optOverlay.classList.remove("show");
    selector = null;
    clearOptErr();
    if (restoreFocus && lastAddBtn && document.contains(lastAddBtn)) lastAddBtn.focus();
  }

  // Raison de blocage du groupe, ou "" — un groupe VIDE n'est bloquant que
  // s'il est exigé (required/min>0): c'est là que la validation est possible-
  // ment impossible, et le message l'explique.
  function groupIssue(g) {
    var count = (selector.sel[g.id] || []).length;
    var min = Number(g.min || 0);
    if (!g.choices || !g.choices.length) {
      return (g.required || min > 0)
        ? "Aucune option disponible : ce groupe est obligatoire, la validation est impossible."
        : "";
    }
    if (g.required && count < Math.max(1, min)) return "Sélection obligatoire manquante.";
    if (count < min) return "Sélectionnez au moins " + min + " option(s).";
    return "";
  }

  // Contrat de validité identique à ItemOptionModal React, + garde max.
  function validSelector() {
    var p = selector.product;
    return (p.options || []).every(function (g) {
      var count = (selector.sel[g.id] || []).length;
      var min = Number(g.min || 0);
      if (g.required && count < Math.max(1, min)) return false;
      if (count < min) return false;
      if (g.max && count > Number(g.max)) return false;
      return true;
    });
  }

  // Récapitulatif d'affichage uniquement (prix catalogue + deltas serveur):
  // le panier reçoit toujours les seuls ids d'options, le serveur recalcule.
  function recapPrice() {
    var p = selector.product;
    var extra = 0;
    (p.options || []).forEach(function (g) {
      (selector.sel[g.id] || []).forEach(function (cid) {
        var c = (g.choices || []).filter(function (x) { return x.id === cid; })[0];
        if (c) extra += Number(c.price_delta || 0);
      });
    });
    return (Number(p.price || 0) + extra) * selector.qty;
  }

  function flatOptionIds() {
    var out = [];
    (selector.product.options || []).forEach(function (g) {
      out = out.concat(selector.sel[g.id] || []);
    });
    return out;
  }

  function syncGroup(g) {
    var sel = selector.sel[g.id] || [];
    Array.prototype.forEach.call(el.optGroups.querySelectorAll(".opt-choice"), function (lab) {
      if (lab.getAttribute("data-gid") !== g.id) return;
      lab.classList.toggle("on", sel.indexOf(lab.getAttribute("data-cid")) >= 0);
    });
  }

  function toggleChoice(g, cid) {
    if (!selector) return;
    var arr = selector.sel[g.id] || [];
    if (g.max === 1) {
      selector.sel[g.id] = [cid];
    } else if (arr.indexOf(cid) >= 0) {
      selector.sel[g.id] = arr.filter(function (x) { return x !== cid; });
    } else if (arr.length < Number(g.max || 1)) {
      selector.sel[g.id] = arr.concat([cid]);
    } else {
      return; // max atteint: sélection ignorée (comme le store React)
    }
    syncGroup(g);
    updateSelectorState();
  }

  function updateSelectorState() {
    if (!selector) return;
    el.optQty.textContent = String(selector.qty);
    var groups = selector.product.options || [];
    groups.forEach(function (g, i) {
      var msg = el.optGroups.querySelector('[data-gmsg-index="' + i + '"]');
      if (!msg) return;
      var issue = groupIssue(g);
      msg.textContent = issue;
      msg.classList.toggle("show", !!issue);
    });
    var ok = validSelector();
    el.optConfirm.disabled = !ok || adding;
    el.optConfirm.textContent = adding ? "Ajout…" : ("Ajouter — " + fmt(recapPrice()));
  }

  function renderSelector() {
    var p = selector.product;
    el.optTitle.textContent = p.name || "";
    el.optDesc.textContent = p.description || "";
    el.optDesc.style.display = p.description ? "" : "none";
    while (el.optGroups.firstChild) el.optGroups.removeChild(el.optGroups.firstChild);
    (p.options || []).forEach(function (g, idx) {
      var gd = document.createElement("div");
      gd.className = "opt-group";
      gd.setAttribute("data-testid", "store-group-" + g.id);
      var head = document.createElement("p");
      head.className = "opt-ghead";
      var nm = document.createElement("span");
      nm.className = "opt-gname";
      nm.textContent = g.name || "";
      head.appendChild(nm);
      if (g.required) {
        var req = document.createElement("span");
        req.className = "opt-req";
        req.textContent = "(obligatoire)";
        head.appendChild(req);
      }
      var lim = document.createElement("span");
      lim.className = "opt-lim";
      lim.textContent = g.max === 1 ? "— 1 choix"
        : (Number(g.min || 0) > 0 ? "— min " + g.min + ", max " + g.max : "— max " + g.max);
      head.appendChild(lim);
      gd.appendChild(head);
      var choices = g.choices || [];
      if (!choices.length) {
        var empty = document.createElement("p");
        empty.className = "opt-empty";
        empty.textContent = "Aucune option disponible dans ce groupe.";
        gd.appendChild(empty);
      } else {
        var box = document.createElement("div");
        box.className = "opt-choices";
        var multi = g.max !== 1;
        choices.forEach(function (c) {
          var lab = document.createElement("label");
          lab.className = "opt-choice" + (c.available ? "" : " off");
          lab.setAttribute("data-gid", g.id);
          lab.setAttribute("data-cid", c.id);
          var input = document.createElement("input");
          input.type = multi ? "checkbox" : "radio";
          input.name = "optgroup-" + idx;
          // Option indisponible: sélection interdite (clavier compris).
          input.disabled = !c.available;
          var sel = selector.sel[g.id] || [];
          input.checked = sel.indexOf(c.id) >= 0;
          if (c.available) {
            input.addEventListener("change", function () { toggleChoice(g, c.id); });
          }
          var txt = document.createElement("span");
          txt.className = "opt-name";
          txt.textContent = c.name || "";
          var delta = document.createElement("span");
          delta.className = "opt-delta";
          delta.textContent = Number(c.price_delta || 0) > 0 ? "+" + fmt(c.price_delta) : "";
          lab.appendChild(input);
          lab.appendChild(txt);
          lab.appendChild(delta);
          if (sel.indexOf(c.id) >= 0) lab.classList.add("on");
          box.appendChild(lab);
        });
        gd.appendChild(box);
      }
      var gmsg = document.createElement("p");
      gmsg.className = "opt-gmsg";
      gmsg.setAttribute("data-gmsg-index", String(idx));
      gd.appendChild(gmsg);
      el.optGroups.appendChild(gd);
    });
    updateSelectorState();
  }

  function send(text, appendUser) {
    var msg = (text || "").trim();
    if (!msg || sending) return;
    sending = true;
    clearError();
    el.loading.classList.add("show");
    el.send.disabled = true;
    el.input.disabled = true;
    if (appendUser) messages.push({ role: "user", content: msg });
    render();
    // Le premier envoi attend la fin de la restauration pour ne pas envoyer
    // sans cart_id pendant qu'un panier restauré est encore en cours de vérif.
    restoreDone.then(function () {
      var body = { restaurant_public_id: restaurantId, message: msg };
      if (conversationId) body.conversation_id = conversationId;
      if (cartId) body.cart_id = cartId;
      return fetch(API + "/api/public/ai/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        return { status: res.status, data: data };
      });
    }).then(function (r) {
      if (r.status < 200 || r.status >= 300) {
        showError(apiErrorDetail(r.data.detail), msg, r.status);
        return;
      }
      conversationId = r.data.conversation_id || conversationId;
      if (r.data.cart_id) {
        cartId = r.data.cart_id;
        storageSet(STORAGE_CART, cartId);
      }
      if (conversationId) storageSet(STORAGE_CONV, conversationId);
      messages.push({ role: "assistant", content: r.data.message || "", cart: r.data.cart || null,
        // D1.54: cartes du dernier outil-carte réussi (rétrocompatible: champ
        // absent d'un ancien backend -> tableau vide, aucun bloc carte).
        products: Array.isArray(r.data.products) ? r.data.products : [] });
      // Commande créée par l'assistant : session terminée — purge des ids pour
      // qu'une prochaine conversation reparte propre (panier ordered jamais
      // réutilisé, conformément au cycle de vie serveur).
      if (r.data.order) purgeSession();
      render();
    }).catch(function () {
      showError("Erreur de connexion. Vérifiez votre réseau.", msg, null);
    }).then(function () {
      sending = false;
      el.loading.classList.remove("show");
      el.send.disabled = !el.input.value.trim();
      el.input.disabled = false;
      el.input.focus();
    });
  }

  el.launcher.addEventListener("click", function () { setOpen(true); });
  el.close.addEventListener("click", function () { setOpen(false); });
  el.input.addEventListener("input", function () { el.send.disabled = sending || !el.input.value.trim(); });
  el.input.addEventListener("keydown", function (e) { if (e.key === "Escape") setOpen(false); });
  el.form.addEventListener("submit", function (e) {
    e.preventDefault();
    var v = el.input.value;
    el.input.value = "";
    el.send.disabled = true;
    send(v, true);
  });
  el.retry.addEventListener("click", function () { send(lastFailedText, false); });
  document.getElementById("new-conv").addEventListener("click", function () {
    // Choisi par l'utilisateur sur un 409 : session neuve, historique vidé,
    // le panier serveur restant (éventuellement ordered) n'est plus référencé.
    purgeSession();
    messages = [];
    clearError();
    render();
  });

  /* ---------- D1.54: interactions du mini-sélecteur ---------- */
  el.optMinus.addEventListener("click", function () {
    if (!selector) return;
    selector.qty = Math.max(1, selector.qty - 1);
    updateSelectorState();
  });
  el.optPlus.addEventListener("click", function () {
    if (!selector) return;
    selector.qty = selector.qty + 1;
    updateSelectorState();
  });
  el.optCancel.addEventListener("click", function () { closeSelector(true); });
  el.optConfirm.addEventListener("click", function () {
    if (!selector || adding) return;
    startAdd(selector.product, flatOptionIds(), selector.qty);
  });
  el.optOverlay.addEventListener("click", function (e) {
    if (e.target === el.optOverlay) closeSelector(true);
  });
  // Échap: ferme le sélecteur en priorité, sinon le panneau (comme avant).
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (el.optOverlay.classList.contains("show")) { closeSelector(true); return; }
    if (open) setOpen(false);
  });
  // Focus piégé tant que le sélecteur est ouvert (accessibilité clavier).
  el.optSheet.addEventListener("keydown", function (e) {
    if (e.key !== "Tab" || !selector) return;
    var f = el.optSheet.querySelectorAll("button:not([disabled]), input:not([disabled])");
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  if (!restaurantId) {
    showError("Identifiant restaurant manquant.", null);
  } else {
    fetch(API + "/api/public/menu/" + encodeURIComponent(restaurantId))
      .then(function (res) {
        if (!res.ok) throw new Error("menu");
        return res.json();
      })
      .then(function (data) {
        var r = data.restaurant || {};
        shopName = r.name || "Assistant";
        welcome = r.welcome_message || "Bonjour 👋 Comment puis-je vous aider ?";
        el.shopName.textContent = shopName;
        // D1.53: le menu public expose restaurant.primary_color (plat, D1.50)
        // — l'ancien r.widget.primary_color n'existait jamais dans ce contrat.
        if (r.primary_color) {
          document.documentElement.style.setProperty("--accent", r.primary_color);
        }
        render();
      })
      .catch(function () {
        welcome = "";
        showError("Impossible de charger le restaurant.", null);
      });
  }
  render();
  notifySize();
})();
</script>
</body>
</html>
