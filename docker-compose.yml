# Déploiement Coolify — MenuMind (backend + frontend + Supabase PostgreSQL)
# Usage dans Coolify : ressource « Docker Compose », repo git, ce fichier à la racine.
# Les variables ${...} sont injectées depuis l'UI Coolify (onglet Environment).

services:
  backend:
    build:
      context: ./backend
    environment:
      # Enable once for a new Supabase database to create demo and admin records.
      MENUMIND_ENV: production
      MENUMIND_SEED_ON_STARTUP: ${MENUMIND_SEED_ON_STARTUP:-true}
      # Supabase PostgreSQL URI (keep the password in Coolify secrets)
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:?SUPABASE_DB_URL manquant — définir dans Coolify}
      # Sécurité — OBLIGATOIRE à définir dans Coolify
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant — définir dans Coolify}
      # CORS : origin publique du frontend (ex. https://votre-domaine)
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL manquant — définir dans Coolify}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Seed super-admin (changers en production !)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Fournisseur IA (gemini par défaut ; aucune clé = réponses d'erreur propres)
      AI_GATEWAY: ${AI_GATEWAY:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AI_MODEL: ${AI_MODEL:-google/gemini-2.5-flash}
      BYTEZ_API_KEY: ${BYTEZ_API_KEY:-}
      BYTEZ_PROVIDER_KEY: ${BYTEZ_PROVIDER_KEY:-}
    restart: unless-stopped
    healthcheck:
      # python:slim n'a ni curl ni wget — on passe par urllib (sort non-0 si status != 2xx)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        # URL publique du backend — brûlée dans le bundle React au build
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:?REACT_APP_BACKEND_URL manquant — définir dans Coolify}
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      # wget (busybox) inclus dans nginx:alpine
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
