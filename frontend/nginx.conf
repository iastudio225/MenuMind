server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Open Graph share cards: /s/<public_id> is proxied to the backend so links
    # shared on WhatsApp carry the restaurant name/logo (crawlers do not run JS).
    location ~ ^/s/(?<pid>[A-Za-z0-9_-]{1,64})$ {
        proxy_pass http://backend:8001/share/$pid$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
