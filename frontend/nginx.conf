server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Docker embedded DNS: "backend" is resolved at request time, not when nginx
    # loads its config. A literal upstream hostname is resolved at startup, so a
    # backend container not yet registered would make nginx exit (503 on the
    # whole frontend). The variable + resolver removes that startup dependency.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $share_backend http://backend:8001;

    # Open Graph share cards: /s/<public_id> is proxied to the backend so links
    # shared on WhatsApp carry the restaurant name/logo (crawlers do not run JS).
    # NOTE: the regex MUST be quoted — nginx's config lexer stops at "{" in an
    # unquoted token, which truncated {1,64} and crashed every worker (503).
    # Do not name the capture "pid": nginx already defines the $pid variable.
    location ~ "^/s/([A-Za-z0-9_-]{1,64})$" {
        proxy_pass $share_backend/share/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
